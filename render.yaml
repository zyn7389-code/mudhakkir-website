services:
  - type: web
    name: mudhakkir-website
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        generateValue: false
        value: mudhakkir2024
    disk:
      name: mudhakkir-data
      mountPath: /usr/src/app/uploads
      sizeGB: 5
